max_active_quests: 3
text:
  enabled: true
  base_delay_ms: 600
  per_char_ms: 25
  max_delay_ms: 2500
rumours:
  enabled: true
  radius: 12
sounds:
  step_complete: "minecraft:ui.button.click"
  quest_complete: "minecraft:ui.toast.challenge_complete"
  volume: 0.6
dialogs:
  enabled: true
preview:
  interval_ticks: 10
  max_distance: 64
advancements:
  enabled: true
export:
  webhook_url: ""
  secret: ""
  server_name: "schwnbrg"
# Text limits checked when quests are saved, loaded and published (summary was fixed at 200 before 1.2).
limits:
  summary: 600
  hint: 200
  line: 256
  lines_per_step: 30
  steps: 50
# Player guide (turned on per quest in /qe): how often the compass bar updates and how far particles are shown.
guide:
  interval_ticks: 5
  particle_distance: 48
