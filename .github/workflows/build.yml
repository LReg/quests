name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Bauen
        run: |
          chmod +x gradlew
          ./gradlew build -PpluginVersion=${{ steps.version.outputs.value }}

      - name: Jars als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: questbook-${{ steps.version.outputs.value }}
          path: build/libs/questbook-${{ steps.version.outputs.value }}-mc*.jar

      - name: Jars ans Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/questbook-${{ steps.version.outputs.value }}-mc*.jar
          generate_release_notes: true
